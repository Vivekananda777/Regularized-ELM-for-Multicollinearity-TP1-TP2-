{% extends 'base.html' %}
{% block title %}Save Configuration{% endblock %}
{% block page_title %}Save Configuration{% endblock %}
{% block content %}
<div class="page-header">
  <div><h1>Save Configuration</h1><p>Save "{{ algo.name }}" for future use</p></div>
</div>
<div class="card" style="max-width:500px">
  <div class="card-header"><h5><i class="fas fa-bookmark me-2" style="color:#4f46e5"></i>Save Config</h5></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3"><label class="form-label">Configuration Name</label>{{ form.name }}</div>
      <div class="mb-4"><label class="form-label">Notes (optional)</label>{{ form.notes }}</div>
      <div class="d-flex gap-3">
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
        <a href="{% url 'algorithms:algorithm_list' %}" class="btn btn-outline-primary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
